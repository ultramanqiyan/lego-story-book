<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回收站 - 乐高故事书</title>
  <link rel="stylesheet" href="css/lego-theme.css">
  <link rel="stylesheet" href="css/loading.css">
</head>
<body>
  <div class="page-container">
    <header class="page-header">
      <div class="page-header-left">
        <a href="index.html" class="lego-btn lego-btn-blue">
          <span>←</span>
        </a>
        <div>
          <h1 class="lego-title" style="font-size: 1.5rem;">回收站</h1>
          <p class="page-header-subtitle">已删除的书籍将保留30天</p>
        </div>
      </div>

      <button id="emptyTrashBtn" class="lego-btn lego-btn-red" style="display: none;">
        <span>🗑️</span>
        <span class="hide-mobile">清空回收站</span>
      </button>
    </header>

    <div class="max-w-4xl mx-auto">
      <div id="trashList">
        <div class="empty-state" style="padding: 64px; background: rgba(255, 213, 0, 0.2); border-radius: 16px; border: 2px dashed var(--lego-black); text-align: center;">
          <span style="font-size: 64px; display: block; margin-bottom: 16px;">🗑️</span>
          <p style="font-weight: bold; font-size: 1.125rem; margin: 0 0 8px;">回收站是空的</p>
          <p style="color: #6b7280; margin: 0;">删除的书籍会在这里显示</p>
        </div>
      </div>
    </div>

    <div class="lego-footer-bar"></div>
  </div>

  <div id="confirmDialog" class="lego-dialog-overlay" style="display: none;">
    <div class="lego-dialog" style="max-width: 400px;">
      <div class="lego-dialog-header">
        <h2 class="lego-dialog-title" id="confirmTitle">确认操作</h2>
      </div>
      <div>
        <p id="confirmMessage" style="text-align: center; margin-bottom: 24px;"></p>
        <div style="display: flex; gap: 12px;">
          <button onclick="closeConfirmDialog()" class="lego-btn lego-btn-gray flex-1">取消</button>
          <button id="confirmBtn" class="lego-btn lego-btn-red flex-1">确认</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/loading-manager.js"></script>
  <script>
    var userId = requireAuth();
    var archivedBooks = [];
    var pendingAction = null;
    var pendingBookId = null;

    document.addEventListener('DOMContentLoaded', function() {
      initLoadingManager();
      loadArchivedBooks();

      document.getElementById('emptyTrashBtn').addEventListener('click', function() {
        showConfirmDialog('清空回收站', '确定要永久删除所有书籍吗？此操作不可撤销。', emptyTrash);
      });
    });

    async function loadArchivedBooks() {
      try {
        var data = await fetchAPI('/books?userId=' + userId + '&archived=true');
        archivedBooks = data.books || [];
        renderTrashList();
      } catch (error) {
        showToast('加载回收站失败', 'error');
        console.error(error);
      }
    }

    function renderTrashList() {
      var container = document.getElementById('trashList');
      var emptyBtn = document.getElementById('emptyTrashBtn');

      if (archivedBooks.length === 0) {
        emptyBtn.style.display = 'none';
        container.innerHTML = '' +
          '<div class="empty-state" style="padding: 64px; background: rgba(255, 213, 0, 0.2); border-radius: 16px; border: 2px dashed var(--lego-black); text-align: center;">' +
            '<span style="font-size: 64px; display: block; margin-bottom: 16px;">🗑️</span>' +
            '<p style="font-weight: bold; font-size: 1.125rem; margin: 0 0 8px;">回收站是空的</p>' +
            '<p style="color: #6b7280; margin: 0;">删除的书籍会在这里显示</p>' +
          '</div>';
        return;
      }

      emptyBtn.style.display = 'flex';

      var html = '<div style="display: flex; flex-direction: column; gap: 16px;">';

      archivedBooks.forEach(function(book) {
        var deletedDate = new Date(book.updated_at);
        var expireDate = new Date(deletedDate.getTime() + 30 * 24 * 60 * 60 * 1000);
        var daysLeft = Math.ceil((expireDate - new Date()) / (24 * 60 * 60 * 1000));
        daysLeft = Math.max(0, daysLeft);

        html += '' +
          '<div class="lego-card" style="padding: 20px;">' +
            '<div style="display: flex; align-items: center; gap: 16px;">' +
              '<div style="width: 60px; height: 60px; background: linear-gradient(135deg, var(--lego-blue), var(--lego-purple)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem;">📖</div>' +
              '<div style="flex: 1;">' +
                '<h3 style="font-weight: bold; margin: 0 0 4px;">' + book.title + '</h3>' +
                '<p style="font-size: 0.875rem; color: #6b7280; margin: 0;">' + book.chapter_count + ' 章</p>' +
                '<p style="font-size: 0.75rem; color: #9ca3af; margin: 4px 0 0;">剩余 ' + daysLeft + ' 天后自动删除</p>' +
              '</div>' +
              '<div style="display: flex; gap: 8px;">' +
                '<button onclick="restoreBook(\'' + book.book_id + '\')" class="lego-btn lego-btn-green" style="padding: 8px 16px;">恢复</button>' +
                '<button onclick="confirmPermanentDelete(\'' + book.book_id + '\', \'' + book.title.replace(/'/g, "\\'") + '\')" class="lego-btn lego-btn-red" style="padding: 8px 16px;">永久删除</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      });

      html += '</div>';
      container.innerHTML = html;
    }

    async function restoreBook(bookId) {
      showLoading({ message: '正在恢复...' });

      try {
        await fetchAPI('/books', {
          method: 'PUT',
          body: JSON.stringify({
            bookId: bookId,
            action: 'restore'
          })
        });

        hideLoading();
        showToast('书籍已恢复', 'success');
        loadArchivedBooks();
      } catch (error) {
        hideLoading();
        showToast('恢复失败：' + error.message, 'error');
      }
    }

    function confirmPermanentDelete(bookId, title) {
      pendingBookId = bookId;
      showConfirmDialog('永久删除', '确定要永久删除《' + title + '》吗？此操作不可撤销。', permanentDelete);
    }

    async function permanentDelete() {
      if (!pendingBookId) return;

      showLoading({ message: '正在删除...' });

      try {
        await fetchAPI('/books/' + pendingBookId + '?permanent=true', {
          method: 'DELETE'
        });

        hideLoading();
        closeConfirmDialog();
        showToast('书籍已永久删除', 'success');
        pendingBookId = null;
        loadArchivedBooks();
      } catch (error) {
        hideLoading();
        showToast('删除失败：' + error.message, 'error');
      }
    }

    async function emptyTrash() {
      showLoading({ message: '正在清空回收站...' });

      try {
        for (var i = 0; i < archivedBooks.length; i++) {
          await fetchAPI('/books/' + archivedBooks[i].book_id + '?permanent=true', {
            method: 'DELETE'
          });
        }

        hideLoading();
        closeConfirmDialog();
        showToast('回收站已清空', 'success');
        loadArchivedBooks();
      } catch (error) {
        hideLoading();
        showToast('清空失败：' + error.message, 'error');
      }
    }

    function showConfirmDialog(title, message, callback) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmBtn').onclick = callback;
      document.getElementById('confirmDialog').style.display = 'flex';
    }

    function closeConfirmDialog() {
      document.getElementById('confirmDialog').style.display = 'none';
      pendingBookId = null;
    }
  </script>

  <style>
    .max-w-4xl { max-width: 56rem; margin-left: auto; margin-right: auto; }
    .mx-auto { margin-left: auto; margin-right: auto; }
  </style>
</body>
</html>
