<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐高故事书 - 动画效果演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d14;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .demo-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      max-width: 1400px;
    }

    .phone-frame {
      width: 320px;
      height: 640px;
      background: #1a1a2e;
      border-radius: 40px;
      padding: 15px;
      box-shadow: 
        0 0 0 3px #333,
        0 0 30px rgba(0,0,0,0.5),
        inset 0 0 20px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 25px;
      background: #0d0d14;
      border-radius: 15px;
      z-index: 100;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: #0d0d14;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
    }

    .demo-title {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #a855f7;
      font-weight: 600;
    }

    /* Particle Background */
    .particle-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.3);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-700px) translateX(30px) rotate(360deg) scale(1);
        opacity: 0;
      }
    }

    /* Glow Orbs */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      animation: moveOrb 15s ease-in-out infinite;
    }

    .glow-orb.gold {
      width: 100px;
      height: 100px;
      background: rgba(255, 215, 0, 0.3);
      top: 20%;
      left: 10%;
    }

    .glow-orb.purple {
      width: 120px;
      height: 120px;
      background: rgba(168, 85, 247, 0.3);
      bottom: 30%;
      right: 10%;
      animation-delay: -5s;
    }

    @keyframes moveOrb {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(50px, 30px); }
      50% { transform: translate(20px, -40px); }
      75% { transform: translate(-30px, 20px); }
    }

    /* Login Screen */
    .login-content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-icon {
      font-size: 60px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.1); }
    }

    .login-title {
      font-size: 28px;
      font-weight: bold;
      color: #ffd700;
      margin: 15px 0 8px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      animation: slideIn 0.8s ease-out;
    }

    .login-subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
      animation: slideIn 0.8s ease-out 0.2s both;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .lego-blocks {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .lego-block {
      width: 35px;
      height: 35px;
      border-radius: 8px;
      animation: popIn 0.5s ease-out both;
    }

    .lego-block:nth-child(1) {
      background: #ffd700;
      animation-delay: 0.3s;
    }
    .lego-block:nth-child(2) {
      background: #3b82f6;
      animation-delay: 0.4s;
    }
    .lego-block:nth-child(3) {
      background: #dc2626;
      animation-delay: 0.5s;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.3) rotate(-30deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .login-card {
      background: #2d2d44;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      border: 2px solid rgba(255,255,255,0.1);
      animation: flyIn 0.6s ease-out 0.6s both;
    }

    @keyframes flyIn {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-field {
      background: #1a1a2e;
      border: 2px solid #ffd700;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      color: #fff;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .gold-button {
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      border: none;
      border-radius: 25px;
      padding: 15px 30px;
      width: 100%;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
      50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
    }

    /* Weather Effects */
    .weather-screen {
      position: relative;
      height: 100%;
    }

    .weather-header {
      padding: 50px 15px 15px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .weather-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffd700;
    }

    .weather-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 15px;
      position: relative;
      z-index: 10;
    }

    .weather-card {
      background: #2d2d44;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .weather-card:hover {
      border-color: #ffd700;
      transform: scale(1.05);
    }

    .weather-card.active {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.1);
    }

    .weather-icon {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .weather-name {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Sun Effect */
    .sun-container {
      position: absolute;
      top: 80px;
      right: 30px;
    }

    .sun-core {
      width: 50px;
      height: 50px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 40px #ffd700;
      animation: sunPulse 3s ease-in-out infinite;
    }

    @keyframes sunPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .sun-rays {
      position: absolute;
      top: -15px;
      left: -15px;
      width: 80px;
      height: 80px;
      animation: sunRotate 20s linear infinite;
    }

    .sun-ray {
      position: absolute;
      width: 4px;
      height: 20px;
      background: #ffd700;
      border-radius: 2px;
      opacity: 0.6;
    }

    @keyframes sunRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Rain Effect */
    .rain-drop {
      position: absolute;
      width: 2px;
      height: 15px;
      background: linear-gradient(to bottom, transparent, rgba(174, 194, 224, 0.8));
      animation: rainFall linear infinite;
    }

    @keyframes rainFall {
      0% { transform: translateY(-20px) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(700px) translateX(-10px); opacity: 0.5; }
    }

    /* Snow Effect */
    .snow-flake {
      position: absolute;
      color: #fff;
      animation: snowFall linear infinite;
      text-shadow: 0 0 5px #fff;
    }

    @keyframes snowFall {
      0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(700px) translateX(20px) rotate(360deg); opacity: 0.3; }
    }

    /* Fog Effect */
    .fog-layer {
      position: absolute;
      left: -100%;
      width: 300%;
      height: 100px;
      background: linear-gradient(90deg, transparent, rgba(180, 180, 200, 0.4), transparent);
      animation: fogMove linear infinite;
    }

    @keyframes fogMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }

    /* Wind Effect */
    .wind-line {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      animation: windBlow linear infinite;
    }

    @keyframes windBlow {
      0% { transform: translateX(-100%); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(400px); opacity: 0; }
    }

    .leaf {
      position: absolute;
      font-size: 16px;
      animation: leafBlow linear infinite;
    }

    @keyframes leafBlow {
      0% { transform: translate(-30px, 0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translate(350px, -30px) rotate(720deg); opacity: 0; }
    }

    /* Rainbow Effect */
    .rainbow-container {
      position: absolute;
      top: 60px;
      left: -50%;
      width: 200%;
      height: 200px;
      overflow: hidden;
      animation: rainbowShimmer 4s ease-in-out infinite;
    }

    @keyframes rainbowShimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    .rainbow-arc {
      position: absolute;
      left: 0;
      right: 0;
      height: 200px;
      border-radius: 200px 200px 0 0;
      border-bottom: none;
    }

    /* Starry Effect */
    .night-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 30, 0.8);
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .moon {
      position: absolute;
      top: 60px;
      right: 30px;
      font-size: 40px;
      filter: drop-shadow(0 0 15px rgba(255, 255, 200, 0.5));
    }

    /* Card Effects */
    .card-screen {
      position: relative;
      height: 100%;
      padding: 50px 15px 15px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .hs-card {
      background: linear-gradient(180deg, #3a3a3a 0%, #2d2d44 100%);
      border-radius: 12px;
      padding: 10px;
      border: 3px solid #ffd700;
      animation: cardBounce 0.5s ease-out both;
      position: relative;
      overflow: hidden;
    }

    .hs-card:nth-child(1) { animation-delay: 0.1s; border-color: #ffd700; }
    .hs-card:nth-child(2) { animation-delay: 0.2s; border-color: #dc2626; }
    .hs-card:nth-child(3) { animation-delay: 0.3s; border-color: #c0c0c0; }
    .hs-card:nth-child(4) { animation-delay: 0.4s; border-color: #a855f7; }

    @keyframes cardBounce {
      0% { opacity: 0; transform: scale(0.5) translateY(30px); }
      70% { transform: scale(1.05) translateY(-5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .role-tag {
      position: absolute;
      top: 5px;
      left: 5px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      color: #000;
    }

    .card-avatar {
      font-size: 36px;
      text-align: center;
      padding: 15px 0;
    }

    .card-name {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #fff8e1;
      background: #3a2a1a;
      padding: 6px;
      border-radius: 4px;
    }

    .card-stats {
      display: flex;
      justify-content: space-between;
      padding: 8px 5px 0;
    }

    .stat-gem {
      width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
    }

    .stat-gem.attack { background: #f59e0b; }
    .stat-gem.health { background: #dc2626; }

    /* Lightning */
    .lightning-flash {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      opacity: 0;
      animation: lightning 5s infinite;
    }

    @keyframes lightning {
      0%, 100% { opacity: 0; }
      45% { opacity: 0; }
      46% { opacity: 1; }
      47% { opacity: 0; }
      48% { opacity: 0.8; }
      49% { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>🧱 乐高故事书 - 动画效果演示</h1>
  <p class="subtitle">桌游风格 UI 动画展示 - Web 版本模拟</p>

  <div class="demo-container">
    <!-- 登录页面演示 -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen" id="login-demo">
          <!-- Particles -->
          <div class="particle-container" id="particles"></div>
          <!-- Glow Orbs -->
          <div class="glow-orb gold"></div>
          <div class="glow-orb purple"></div>
          <!-- Login Content -->
          <div class="login-content">
            <div class="login-icon">🧱</div>
            <div class="login-title">乐高故事书</div>
            <div class="login-subtitle">🎮 登录开始你的冒险！</div>
            <div class="lego-blocks">
              <div class="lego-block"></div>
              <div class="lego-block"></div>
              <div class="lego-block"></div>
            </div>
            <div class="login-card">
              <input type="text" class="input-field" placeholder="输入你的冒险者名字">
              <button class="gold-button">🚀 开始冒险</button>
            </div>
          </div>
        </div>
      </div>
      <div class="demo-title">登录页面 - 粒子背景 + 卡牌入场</div>
    </div>

    <!-- 天气效果演示 -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen" id="weather-demo">
          <div class="weather-screen">
            <div class="weather-header">
              <div class="weather-title">🌤️ 选择天气效果</div>
            </div>
            <div class="weather-grid">
              <div class="weather-card active" onclick="setWeather('sunny')">
                <div class="weather-icon">☀️</div>
                <div class="weather-name">晴天</div>
              </div>
              <div class="weather-card" onclick="setWeather('rainy')">
                <div class="weather-icon">🌧️</div>
                <div class="weather-name">下雨</div>
              </div>
              <div class="weather-card" onclick="setWeather('thunder')">
                <div class="weather-icon">⛈️</div>
                <div class="weather-name">打雷</div>
              </div>
              <div class="weather-card" onclick="setWeather('snow')">
                <div class="weather-icon">❄️</div>
                <div class="weather-name">下雪</div>
              </div>
              <div class="weather-card" onclick="setWeather('fog')">
                <div class="weather-icon">🌫️</div>
                <div class="weather-name">大雾</div>
              </div>
              <div class="weather-card" onclick="setWeather('wind')">
                <div class="weather-icon">💨</div>
                <div class="weather-name">狂风</div>
              </div>
              <div class="weather-card" onclick="setWeather('rainbow')">
                <div class="weather-icon">🌈</div>
                <div class="weather-name">彩虹</div>
              </div>
              <div class="weather-card" onclick="setWeather('starry')">
                <div class="weather-icon">🌟</div>
                <div class="weather-name">星夜</div>
              </div>
            </div>
          </div>
          <!-- Weather Effects Container -->
          <div id="weather-effects"></div>
        </div>
      </div>
      <div class="demo-title">天气特效 - 点击切换 8 种效果</div>
    </div>

    <!-- 卡牌效果演示 -->
    <div>
      <div class="phone-frame">
        <div class="phone-screen" id="card-demo">
          <div class="particle-container" id="particles2"></div>
          <div class="glow-orb gold"></div>
          <div class="glow-orb purple"></div>
          <div class="card-screen">
            <div class="card-grid">
              <div class="hs-card">
                <div class="role-tag" style="background: #ffd700;">主角</div>
                <div class="card-avatar">🧙</div>
                <div class="card-name">法师</div>
                <div class="card-stats">
                  <div class="stat-gem attack">5</div>
                  <div class="stat-gem health">8</div>
                </div>
              </div>
              <div class="hs-card">
                <div class="role-tag" style="background: #dc2626;">反派</div>
                <div class="card-avatar">🦸</div>
                <div class="card-name">战士</div>
                <div class="card-stats">
                  <div class="stat-gem attack">7</div>
                  <div class="stat-gem health">6</div>
                </div>
              </div>
              <div class="hs-card">
                <div class="role-tag" style="background: #c0c0c0;">配角</div>
                <div class="card-avatar">🧝</div>
                <div class="card-name">精灵</div>
                <div class="card-stats">
                  <div class="stat-gem attack">2</div>
                  <div class="stat-gem health">4</div>
                </div>
              </div>
              <div class="hs-card">
                <div class="role-tag" style="background: #a855f7;">冒险</div>
                <div class="card-avatar">🧛</div>
                <div class="card-name">盗贼</div>
                <div class="card-stats">
                  <div class="stat-gem attack">4</div>
                  <div class="stat-gem health">5</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="demo-title">角色卡牌 - 炉石传说风格弹跳入场</div>
    </div>
  </div>

  <script>
    // Create particles
    function createParticles(containerId, count = 20) {
      const container = document.getElementById(containerId);
      if (!container) return;
      
      const colors = ['#ffd700', '#a855f7', '#3b82f6', '#22c55e'];
      
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.width = (3 + Math.random() * 5) + 'px';
        particle.style.height = particle.style.width;
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        particle.style.animationDuration = (8 + Math.random() * 6) + 's';
        particle.style.animationDelay = Math.random() * 10 + 's';
        container.appendChild(particle);
      }
    }

    createParticles('particles', 25);
    createParticles('particles2', 25);

    // Weather effects
    function setWeather(type) {
      const container = document.getElementById('weather-effects');
      container.innerHTML = '';
      
      // Update active state
      document.querySelectorAll('.weather-card').forEach(card => {
        card.classList.remove('active');
      });
      event.target.closest('.weather-card').classList.add('active');

      switch(type) {
        case 'sunny':
          createSunnyEffect(container);
          break;
        case 'rainy':
          createRainEffect(container);
          break;
        case 'thunder':
          createThunderEffect(container);
          break;
        case 'snow':
          createSnowEffect(container);
          break;
        case 'fog':
          createFogEffect(container);
          break;
        case 'wind':
          createWindEffect(container);
          break;
        case 'rainbow':
          createRainbowEffect(container);
          break;
        case 'starry':
          createStarryEffect(container);
          break;
      }
    }

    function createSunnyEffect(container) {
      const sunContainer = document.createElement('div');
      sunContainer.className = 'sun-container';
      
      const sunCore = document.createElement('div');
      sunCore.className = 'sun-core';
      
      const sunRays = document.createElement('div');
      sunRays.className = 'sun-rays';
      
      for (let i = 0; i < 8; i++) {
        const ray = document.createElement('div');
        ray.className = 'sun-ray';
        ray.style.top = '40px';
        ray.style.left = '38px';
        ray.style.transform = `rotate(${i * 45}deg)`;
        ray.style.transformOrigin = 'center 0';
        sunRays.appendChild(ray);
      }
      
      sunContainer.appendChild(sunCore);
      sunContainer.appendChild(sunRays);
      container.appendChild(sunContainer);
    }

    function createRainEffect(container) {
      for (let i = 0; i < 40; i++) {
        const drop = document.createElement('div');
        drop.className = 'rain-drop';
        drop.style.left = Math.random() * 100 + '%';
        drop.style.animationDuration = (0.4 + Math.random() * 0.3) + 's';
        drop.style.animationDelay = Math.random() * 2 + 's';
        drop.style.opacity = 0.3 + Math.random() * 0.5;
        container.appendChild(drop);
      }
    }

    function createThunderEffect(container) {
      createRainEffect(container);
      const flash = document.createElement('div');
      flash.className = 'lightning-flash';
      container.appendChild(flash);
    }

    function createSnowEffect(container) {
      for (let i = 0; i < 30; i++) {
        const flake = document.createElement('div');
        flake.className = 'snow-flake';
        flake.textContent = '❄';
        flake.style.left = Math.random() * 100 + '%';
        flake.style.fontSize = (10 + Math.random() * 14) + 'px';
        flake.style.animationDuration = (4 + Math.random() * 4) + 's';
        flake.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(flake);
      }
    }

    function createFogEffect(container) {
      for (let i = 0; i < 4; i++) {
        const fog = document.createElement('div');
        fog.className = 'fog-layer';
        fog.style.top = (80 + i * 120) + 'px';
        fog.style.animationDuration = (12 + i * 3) + 's';
        fog.style.opacity = 0.15 + i * 0.1;
        container.appendChild(fog);
      }
    }

    function createWindEffect(container) {
      for (let i = 0; i < 15; i++) {
        const line = document.createElement('div');
        line.className = 'wind-line';
        line.style.top = Math.random() * 100 + '%';
        line.style.width = (60 + Math.random() * 80) + 'px';
        line.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';
        line.style.animationDelay = Math.random() * 3 + 's';
        container.appendChild(line);
      }
      
      const leaves = ['🍂', '🍃', '🌿'];
      for (let i = 0; i < 8; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.textContent = leaves[Math.floor(Math.random() * leaves.length)];
        leaf.style.top = (20 + Math.random() * 60) + '%';
        leaf.style.animationDuration = (2 + Math.random() * 1.5) + 's';
        leaf.style.animationDelay = Math.random() * 4 + 's';
        container.appendChild(leaf);
      }
    }

    function createRainbowEffect(container) {
      const rainbowContainer = document.createElement('div');
      rainbowContainer.className = 'rainbow-container';
      
      const colors = [
        'rgba(255, 0, 0, 0.4)',
        'rgba(255, 165, 0, 0.4)',
        'rgba(255, 255, 0, 0.4)',
        'rgba(0, 255, 0, 0.4)',
        'rgba(0, 0, 255, 0.4)',
        'rgba(75, 0, 130, 0.4)',
        'rgba(238, 130, 238, 0.4)'
      ];
      
      colors.forEach((color, i) => {
        const arc = document.createElement('div');
        arc.className = 'rainbow-arc';
        arc.style.top = (i * 12) + 'px';
        arc.style.borderTop = '25px solid ' + color;
        arc.style.borderLeft = '25px solid transparent';
        arc.style.borderRight = '25px solid transparent';
        rainbowContainer.appendChild(arc);
      });
      
      container.appendChild(rainbowContainer);
      
      // Sparkles
      for (let i = 0; i < 15; i++) {
        const sparkle = document.createElement('div');
        sparkle.style.position = 'absolute';
        sparkle.style.left = (10 + Math.random() * 80) + '%';
        sparkle.style.top = (10 + Math.random() * 30) + '%';
        sparkle.style.fontSize = '14px';
        sparkle.textContent = '✨';
        sparkle.style.animation = `twinkle ${1 + Math.random()}s ease-in-out infinite`;
        sparkle.style.animationDelay = Math.random() * 2 + 's';
        container.appendChild(sparkle);
      }
    }

    function createStarryEffect(container) {
      const overlay = document.createElement('div');
      overlay.className = 'night-overlay';
      container.appendChild(overlay);
      
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 60 + '%';
        const size = 2 + Math.random() * 3;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.animationDuration = (1 + Math.random() * 2) + 's';
        star.style.animationDelay = Math.random() * 3 + 's';
        container.appendChild(star);
      }
      
      const moon = document.createElement('div');
      moon.className = 'moon';
      moon.textContent = '🌙';
      container.appendChild(moon);
    }

    // Initialize with sunny weather
    setWeather('sunny');
  </script>
</body>
</html>
