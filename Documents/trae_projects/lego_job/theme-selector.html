<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择你的风格 - 乐高故事书</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .selector-container {
      max-width: 1200px;
      width: 100%;
      text-align: center;
    }

    .selector-title {
      font-size: 2.5rem;
      color: white;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .selector-subtitle {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.9);
      margin-bottom: 40px;
    }

    .themes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .theme-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .theme-card:hover {
      transform: translateY(-10px) scale(1.02);
    }

    .theme-card.active {
      box-shadow: 0 0 0 4px #ffd600, 0 20px 40px rgba(0,0,0,0.3);
    }

    .theme-preview {
      height: 150px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      overflow: hidden;
    }

    /* 乐高风格预览 */
    .theme-card[data-theme="lego"] .theme-preview {
      background: linear-gradient(135deg, #e53935, #ffd600, #1e88e5);
      box-shadow: 0 8px 0 rgba(0,0,0,0.2);
    }

    .theme-card[data-theme="lego"] .theme-preview::before {
      content: '🧱';
      animation: legoBounce 1s ease-in-out infinite;
    }

    @keyframes legoBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    /* 童话风格预览 */
    .theme-card[data-theme="fairy"] .theme-preview {
      background: linear-gradient(135deg, #ffb7c5, #d4a5ff, #a8d8ff);
    }

    .theme-card[data-theme="fairy"] .theme-preview::before {
      content: '✨';
      animation: fairySparkle 1.5s ease-in-out infinite;
    }

    @keyframes fairySparkle {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    /* 科幻风格预览 */
    .theme-card[data-theme="scifi"] .theme-preview {
      background: #0a0a1a;
      border: 2px solid #00f5ff;
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
    }

    .theme-card[data-theme="scifi"] .theme-preview::before {
      content: '🚀';
      animation: sciFloat 2s ease-in-out infinite;
      filter: drop-shadow(0 0 10px #00f5ff);
    }

    @keyframes sciFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* 自然风格预览 */
    .theme-card[data-theme="nature"] .theme-preview {
      background: linear-gradient(180deg, #87ceeb 0%, #7cb342 100%);
    }

    .theme-card[data-theme="nature"] .theme-preview::before {
      content: '🌲';
      animation: treeSway 2s ease-in-out infinite;
    }

    @keyframes treeSway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    .theme-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .theme-description {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.5;
    }

    .theme-features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 15px;
    }

    .feature-tag {
      background: #f0f0f0;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      color: #555;
    }

    .selector-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-select {
      padding: 15px 50px;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    .btn-primary-select {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary-select:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
    }

    .btn-secondary-select {
      background: white;
      color: #667eea;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .btn-secondary-select:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .current-theme {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      border-radius: 50px;
      color: white;
      margin-bottom: 30px;
      display: inline-block;
    }

    @media (max-width: 768px) {
      .selector-title {
        font-size: 1.8rem;
      }

      .themes-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .theme-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="selector-container">
    <h1 class="selector-title">🎨 选择你喜欢的风格</h1>
    <p class="selector-subtitle">每种风格都有独特的视觉效果和动画体验</p>

    <div class="current-theme" id="currentTheme">
      当前风格：<span id="currentThemeName">默认风格</span>
    </div>

    <div class="themes-grid">
      <!-- 乐高积木风格 -->
      <div class="theme-card" data-theme="lego" onclick="selectTheme('lego')">
        <div class="theme-preview"></div>
        <h3 class="theme-name">乐高积木</h3>
        <p class="theme-description">3D积木效果、鲜艳色彩、弹性动画，充满童趣和活力</p>
        <div class="theme-features">
          <span class="feature-tag">🧱 积木效果</span>
          <span class="feature-tag">🎨 鲜艳色彩</span>
          <span class="feature-tag">⚡ 弹性动画</span>
        </div>
      </div>

      <!-- 梦幻童话风格 -->
      <div class="theme-card" data-theme="fairy" onclick="selectTheme('fairy')">
        <div class="theme-preview"></div>
        <h3 class="theme-name">梦幻童话</h3>
        <p class="theme-description">柔和渐变、星光闪烁、漂浮动画，如梦似幻的体验</p>
        <div class="theme-features">
          <span class="feature-tag">✨ 星光闪烁</span>
          <span class="feature-tag">🌸 花瓣飘落</span>
          <span class="feature-tag">☁️ 云朵漂浮</span>
        </div>
      </div>

      <!-- 科幻未来风格 -->
      <div class="theme-card" data-theme="scifi" onclick="selectTheme('scifi')">
        <div class="theme-preview"></div>
        <h3 class="theme-name">科幻未来</h3>
        <p class="theme-description">霓虹光效、网格背景、科技感动画，进入数字世界</p>
        <div class="theme-features">
          <span class="feature-tag">💫 霓虹光效</span>
          <span class="feature-tag">📊 数据流动</span>
          <span class="feature-tag">🤖 科技感</span>
        </div>
      </div>

      <!-- 自然森林风格 -->
      <div class="theme-card" data-theme="nature" onclick="selectTheme('nature')">
        <div class="theme-preview"></div>
        <h3 class="theme-name">自然森林</h3>
        <p class="theme-description">有机形态、木纹质感、生长动画，回归大自然</p>
        <div class="theme-features">
          <span class="feature-tag">🌿 树叶飘落</span>
          <span class="feature-tag">🦋 蝴蝶飞舞</span>
          <span class="feature-tag">🌱 生长动画</span>
        </div>
      </div>
    </div>

    <div class="selector-actions">
      <button class="btn-select btn-primary-select" onclick="applyTheme()">
        ✨ 应用选中的风格
      </button>
      <button class="btn-select btn-secondary-select" onclick="goBack()">
        ← 返回首页
      </button>
    </div>
  </div>

  <script>
    let selectedTheme = localStorage.getItem('selectedTheme') || '';
    const themeNames = {
      'lego': '乐高积木',
      'fairy': '梦幻童话',
      'scifi': '科幻未来',
      'nature': '自然森林',
      '': '默认风格'
    };

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      updateCurrentThemeDisplay();
      highlightSelectedTheme();
    });

    // 选择主题
    function selectTheme(theme) {
      selectedTheme = theme;

      // 移除所有active类
      document.querySelectorAll('.theme-card').forEach(card => {
        card.classList.remove('active');
      });

      // 添加active类到选中的卡片
      document.querySelector(`[data-theme="${theme}"]`).classList.add('active');
    }

    // 应用主题
    function applyTheme() {
      if (!selectedTheme) {
        alert('请先选择一个风格！');
        return;
      }

      localStorage.setItem('selectedTheme', selectedTheme);
      updateCurrentThemeDisplay();

      // 显示成功提示
      showNotification(`已切换到${themeNames[selectedTheme]}风格！`);

      // 延迟后返回首页
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    }

    // 返回首页
    function goBack() {
      window.location.href = 'index.html';
    }

    // 更新当前主题显示
    function updateCurrentThemeDisplay() {
      const currentTheme = localStorage.getItem('selectedTheme') || '';
      document.getElementById('currentThemeName').textContent = themeNames[currentTheme];
    }

    // 高亮已选中的主题
    function highlightSelectedTheme() {
      if (selectedTheme) {
        const card = document.querySelector(`[data-theme="${selectedTheme}"]`);
        if (card) {
          card.classList.add('active');
        }
      }
    }

    // 显示通知
    function showNotification(message) {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255,255,255,0.95);
        padding: 15px 30px;
        border-radius: 50px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        font-weight: 600;
        color: #333;
        z-index: 10000;
        animation: slideDown 0.3s ease;
      `;
      notification.textContent = message;
      document.body.appendChild(notification);

      setTimeout(() => {
        notification.style.animation = 'slideUp 0.3s ease';
        setTimeout(() => notification.remove(), 300);
      }, 2000);
    }
  </script>

  <style>
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      to {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
    }
  </style>
</body>
</html>
