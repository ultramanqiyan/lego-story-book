<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择主题风格 - 乐高故事书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&family=Cinzel:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" id="theme-stylesheet" href="" disabled>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    
    .theme-selector-container {
      max-width: 900px;
      width: 100%;
    }
    
    .page-title {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .page-title h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #E3000F, #FF6B35, #FFD500, #00A651, #006CB7);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowMove 3s linear infinite;
    }
    
    .page-title p {
      color: #666;
      font-size: 1.1rem;
    }
    
    @keyframes rainbowMove {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    
    .themes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }
    
    .theme-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
    }
    
    .theme-card::before {
      content: '';
      display: block;
      height: 8px;
    }
    
    .theme-card.default::before {
      background: linear-gradient(90deg, #E3000F, #FFD500, #006CB7, #00A651);
    }
    
    .theme-card.immersive::before {
      background: linear-gradient(90deg, #6366F1, #8B5CF6, #FCD34D);
    }
    
    .theme-card.gamified::before {
      background: linear-gradient(90deg, #10B981, #F59E0B, #EF4444);
    }
    
    .theme-card:hover {
      transform: translateY(-10px) rotateX(2deg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }
    
    .theme-card.selected {
      border: 4px solid #FFD500;
    }
    
    .theme-card.selected::after {
      content: '✓';
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: #00A651;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 166, 81, 0.4);
    }
    
    .theme-preview {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .theme-card.default .theme-preview {
      background: linear-gradient(135deg, #FFFBF0, #FFF8E7);
    }
    
    .theme-card.immersive .theme-preview {
      background: linear-gradient(135deg, #1E1B4B, #312E81);
    }
    
    .theme-card.gamified .theme-preview {
      background: linear-gradient(135deg, #064E3B, #065F46);
    }
    
    .theme-icon {
      font-size: 5rem;
      position: relative;
      z-index: 1;
    }
    
    .theme-card.immersive .theme-icon,
    .theme-card.gamified .theme-icon {
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
    }
    
    .theme-info {
      padding: 25px;
    }
    
    .theme-info h3 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .theme-info p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }
    
    .theme-features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .feature-tag {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    
    .theme-card.default .feature-tag {
      background: #FEF3C7;
      color: #92400E;
    }
    
    .theme-card.immersive .feature-tag {
      background: #EDE9FE;
      color: #5B21B6;
    }
    
    .theme-card.gamified .feature-tag {
      background: #D1FAE5;
      color: #065F46;
    }
    
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #006CB7, #448AFF);
      color: white;
      box-shadow: 0 4px 0 #004a8f, 0 6px 20px rgba(0, 108, 183, 0.4);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #004a8f, 0 10px 30px rgba(0, 108, 183, 0.5);
    }
    
    .btn-secondary {
      background: white;
      color: #006CB7;
      border: 3px solid #006CB7;
    }
    
    .btn-secondary:hover {
      background: #F0F7FF;
    }
    
    .preview-section {
      margin-top: 60px;
      text-align: center;
    }
    
    .preview-section h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #006CB7;
    }
    
    .preview-frame {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      margin: 0 auto;
    }
    
    .preview-frame h4 {
      margin-bottom: 15px;
      color: #333;
    }
    
    .preview-components {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    
    .preview-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }
    
    .preview-card {
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }
    
    [data-theme="immersive"] .preview-section {
      color: #F5E6D3;
    }
    
    [data-theme="immersive"] .preview-section h2 {
      color: #FCD34D;
    }
    
    [data-theme="immersive"] .preview-frame {
      background: linear-gradient(145deg, #F5E6D3, #E8D4B8);
      border: 2px solid #FCD34D;
    }
    
    [data-theme="immersive"] .preview-frame h4 {
      color: #1E1B4B;
      font-family: 'Cinzel', serif;
    }
    
    [data-theme="gamified"] .preview-section {
      color: #ECFDF5;
    }
    
    [data-theme="gamified"] .preview-section h2 {
      color: #FCD34D;
    }
    
    [data-theme="gamified"] .preview-frame {
      background: linear-gradient(145deg, #047857, #065F46);
      border: 2px solid #10B981;
    }
    
    [data-theme="gamified"] .preview-frame h4 {
      color: #FCD34D;
      font-family: 'Rajdhani', sans-serif;
    }
  </style>
</head>
<body>
  <div class="theme-selector-container">
    <div class="page-title">
      <h1>🎨 选择主题风格</h1>
      <p>为你的故事书选择一个独特的视觉风格</p>
    </div>
    
    <div class="themes-grid">
      <div class="theme-card default" data-theme="default">
        <div class="theme-preview">
          <span class="theme-icon">🧱</span>
        </div>
        <div class="theme-info">
          <h3>经典乐高</h3>
          <p>经典乐高风格，活力童趣，适合所有年龄段</p>
          <div class="theme-features">
            <span class="feature-tag">品牌经典</span>
            <span class="feature-tag">活力童趣</span>
            <span class="feature-tag">丰富动画</span>
          </div>
        </div>
      </div>
      
      <div class="theme-card immersive" data-theme="immersive">
        <div class="theme-preview">
          <span class="theme-icon">📖</span>
        </div>
        <div class="theme-info">
          <h3>沉浸故事</h3>
          <p>古典故事书风格，羊皮纸质感，沉浸式阅读体验</p>
          <div class="theme-features">
            <span class="feature-tag">古典优雅</span>
            <span class="feature-tag">故事感</span>
            <span class="feature-tag">沉浸体验</span>
          </div>
        </div>
      </div>
      
      <div class="theme-card gamified" data-theme="gamified">
        <div class="theme-preview">
          <span class="theme-icon">🎮</span>
        </div>
        <div class="theme-info">
          <h3>游戏冒险</h3>
          <p>游戏化界面风格，等级成就系统，增强用户粘性</p>
          <div class="theme-features">
            <span class="feature-tag">游戏化</span>
            <span class="feature-tag">成就系统</span>
            <span class="feature-tag">用户粘性</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="action-buttons">
      <a href="index.html" class="btn btn-secondary">← 返回首页</a>
      <button class="btn btn-primary" id="applyThemeBtn">应用选中主题</button>
    </div>
    
    <div class="preview-section">
      <h2>👁️ 实时预览</h2>
      <div class="preview-frame">
        <h4>当前主题效果预览</h4>
        <div class="preview-components">
          <button class="preview-btn btn-primary">主要按钮</button>
          <button class="preview-btn btn-secondary">次要按钮</button>
          <div class="preview-card card">
            <p>卡片样式预览</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/theme-manager.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var themeCards = document.querySelectorAll('.theme-card');
      var applyBtn = document.getElementById('applyThemeBtn');
      var selectedTheme = localStorage.getItem('lego-story-theme') || 'default';
      
      function updateSelectedCard(theme) {
        themeCards.forEach(function(card) {
          if (card.dataset.theme === theme) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
        });
      }
      
      updateSelectedCard(selectedTheme);
      
      themeCards.forEach(function(card) {
        card.addEventListener('click', function() {
          var theme = this.dataset.theme;
          selectedTheme = theme;
          updateSelectedCard(theme);
          ThemeManager.applyTheme(theme);
        });
      });
      
      applyBtn.addEventListener('click', function() {
        ThemeManager.applyTheme(selectedTheme);
        ThemeManager.showToast('主题已应用：' + ThemeManager.getThemeData(selectedTheme).name, 'success');
        setTimeout(function() {
          window.location.href = 'index.html';
        }, 1000);
      });
      
      document.addEventListener('themeChanged', function(e) {
        updateSelectedCard(e.detail.theme);
      });
    });
  </script>
</body>
</html>
