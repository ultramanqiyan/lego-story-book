<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO 故事冒险 - 后端API联动测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #ffffff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 40px 0;
        }
        .header h1 {
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .header p {
            color: #b8b8b8;
            margin-top: 10px;
        }
        .api-status {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }
        .api-status.connected {
            border-color: #4caf50;
        }
        .api-status.error {
            border-color: #ff4444;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
        }
        .status-dot.connected {
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .login-form {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 16px;
            padding: 30px;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #ffffff;
            font-size: 16px;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #ffd700;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffd700 0%, #ff9800 100%);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .card {
            background: rgba(22, 33, 62, 0.9);
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
            border: 2px solid #333;
            transition: border-color 0.2s, cursor: pointer;
            cursor: pointer;
        }
        .card:hover {
            border-color: #ffd700;
        }
        .card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        .card h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        .card p {
            color: #b8b8b8;
        }
        .back-btn {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            display: inline-block;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .menu-item {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }
        .menu-item .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .menu-item .title {
            font-size: 1.2em;
            color: #ffd700;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .toast.success {
            background: #4caf50;
        }
        .toast.error {
            background: #ff4444;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #b8b8b8;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .data-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
            overflow-x: auto;
        }
        .user-info {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info .username {
            color: #ffd700;
            font-weight: bold;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #b8b8b8;
        }
        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        .chapter-list {
            margin-top: 20px;
        }
        .chapter-item {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .chapter-item:hover {
            border-color: #ffd700;
        }
        .chapter-item .chapter-number {
            color: #ffd700;
            font-weight: bold;
        }
        .character-card {
            background: rgba(22, 33, 62, 0.9);
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
            border: 2px solid #333;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .character-avatar {
            width: 60px;
            height: 60px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }
        .character-info {
            flex: 1;
        }
        .character-info h3 {
            color: #ffd700;
        }
        .character-info p {
            color: #b8b8b8;
            font-size: 14px;
        }
        .plot-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .plot-option {
            background: rgba(22, 33, 62, 0.8);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }
        .plot-option:hover {
            border-color: #ffd700;
        }
        .plot-option.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        .plot-section h4 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        .test-result {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #333;
        }
        .test-result.pass {
            border-left-color: #4caf50;
        }
        .test-result.fail {
            border-left-color: #ff4444;
        }
        .test-result .test-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .test-result .test-detail {
            color: #b8b8b8;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- API状态显示 -->
        <div id="api-status" class="api-status">
            <div class="status-indicator">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">正在连接后端API...</span>
            </div>
            <div id="api-url" style="color: #b8b8b8; margin-top: 10px; font-size: 14px;"></div>
        </div>

        <!-- 登录屏幕 -->
        <div id="login-screen" class="screen">
            <div class="header">
                <h1>LEGO 故事冒险</h1>
                <p>后端API联动测试</p>
            </div>
            <div class="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="输入用户名">
                </div>
                <div class="form-group">
                    <label for="email">邮箱 (可选)</label>
                    <input type="email" id="email" placeholder="输入邮箱">
                </div>
                <button class="btn" id="login-btn">登录 / 注册</button>
                <p style="text-align: center; margin-top: 15px; color: #b8b8b8; font-size: 14px;">
                    新用户将自动创建账号
                </p>
            </div>
        </div>

        <!-- 主页屏幕 -->
        <div id="home-screen" class="screen">
            <div class="user-info">
                <div>
                    <span>欢迎, </span>
                    <span id="display-username" class="username"></span>
                </div>
                <button class="back-btn" id="logout-btn">退出登录</button>
            </div>
            <div class="header">
                <h1>LEGO 故事冒险</h1>
                <p>选择你的冒险</p>
            </div>
            <div class="menu-grid">
                <div class="menu-item" data-screen="bookshelf">
                    <div class="icon">📚</div>
                    <div class="title">书架</div>
                </div>
                <div class="menu-item" data-screen="characters">
                    <div class="icon">👥</div>
                    <div class="title">人仔</div>
                </div>
                <div class="menu-item" data-screen="plot-options">
                    <div class="icon">🎭</div>
                    <div class="title">情节选项</div>
                </div>
                <div class="menu-item" data-screen="test-runner">
                    <div class="icon">🧪</div>
                    <div class="title">测试运行器</div>
                </div>
            </div>
        </div>

        <!-- 书架屏幕 -->
        <div id="bookshelf-screen" class="screen">
            <button class="back-btn" data-back>← 返回</button>
            <div class="header">
                <h1>我的书架</h1>
            </div>
            <button class="btn" id="create-book-btn" style="margin-bottom: 20px;">+ 创建新书籍</button>
            <div id="books-list"></div>
        </div>

        <!-- 创建书籍屏幕 -->
        <div id="create-book-screen" class="screen">
            <button class="back-btn" id="back-to-bookshelf">← 返回书架</button>
            <div class="header">
                <h1>创建新书籍</h1>
            </div>
            <div class="login-form">
                <div class="form-group">
                    <label for="book-title">书籍标题</label>
                    <input type="text" id="book-title" placeholder="输入书籍标题">
                </div>
                <button class="btn" id="submit-create-book">创建书籍</button>
            </div>
        </div>

        <!-- 书籍详情屏幕 -->
        <div id="book-detail-screen" class="screen">
            <button class="back-btn" id="back-to-bookshelf-from-detail">← 返回书架</button>
            <div class="header">
                <h1 id="book-detail-title">书籍详情</h1>
            </div>
            <div id="book-info" class="data-display"></div>
            <div class="chapter-list" id="chapters-list"></div>
            <button class="btn" id="generate-chapter-btn">生成新章节</button>
            <button class="btn btn-danger" id="delete-book-btn">删除书籍</button>
        </div>

        <!-- 人仔屏幕 -->
        <div id="characters-screen" class="screen">
            <button class="back-btn" data-back>← 返回</button>
            <div class="header">
                <h1>我的人仔</h1>
            </div>
            <button class="btn" id="create-character-btn" style="margin-bottom: 20px;">+ 创建新人仔</button>
            <div id="characters-list"></div>
        </div>

        <!-- 创建人仔屏幕 -->
        <div id="create-character-screen" class="screen">
            <button class="back-btn" id="back-to-characters">← 返回人仔列表</button>
            <div class="header">
                <h1>创建新人仔</h1>
            </div>
            <div class="login-form">
                <div class="form-group">
                    <label for="character-name">人仔名称</label>
                    <input type="text" id="character-name" placeholder="输入人仔名称">
                </div>
                <div class="form-group">
                    <label for="character-description">描述</label>
                    <textarea id="character-description" rows="3" placeholder="描述这个人仔"></textarea>
                </div>
                <div class="form-group">
                    <label for="character-personality">性格特点</label>
                    <input type="text" id="character-personality" placeholder="如: 勇敢、善良">
                </div>
                <button class="btn" id="submit-create-character">创建人仔</button>
            </div>
        </div>

        <!-- 情节选项屏幕 -->
        <div id="plot-options-screen" class="screen">
            <button class="back-btn" data-back>← 返回</button>
            <div class="header">
                <h1>情节选项</h1>
            </div>
            <div id="plot-options-container"></div>
        </div>

        <!-- 测试运行器屏幕 -->
        <div id="test-runner-screen" class="screen">
            <button class="back-btn" data-back>← 返回</button>
            <div class="header">
                <h1>API测试运行器</h1>
            </div>
            <button class="btn" id="run-all-tests">运行所有测试</button>
            <div id="test-results" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8788/api';
        let currentUser = null;
        let currentBook = null;
        let currentBooks = [];
        let currentCharacters = [];

        document.getElementById('api-url').textContent = `API地址: ${API_BASE}`;

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function apiRequest(endpoint, options = {}) {
            const url = `${API_BASE}${endpoint}`;
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'API请求失败');
            }
            return data;
        }

        async function checkAPIStatus() {
            try {
                const response = await fetch(`${API_BASE}/plot-options`);
                if (response.ok) {
                    document.getElementById('status-dot').classList.add('connected');
                    document.getElementById('api-status').classList.add('connected');
                    document.getElementById('status-text').textContent = '后端API已连接';
                    return true;
                }
            } catch (error) {
                document.getElementById('status-text').textContent = '后端API连接失败';
                document.getElementById('api-status').classList.add('error');
                return false;
            }
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            
            if (!username) {
                showToast('请输入用户名', 'error');
                return;
            }

            try {
                const data = await apiRequest('/users', {
                    method: 'POST',
                    body: { username, email: email || `${username}@test.com` }
                });
                currentUser = {
                    user_id: data.userId,
                    username: username,
                    isNewUser: data.isNewUser
                };
                document.getElementById('display-username').textContent = username;
                showScreen('home-screen');
                showToast(data.isNewUser ? `欢迎新用户, ${username}!` : `欢迎回来, ${username}!`);
            } catch (error) {
                showToast(`登录失败: ${error.message}`, 'error');
            }
        }

        async function logout() {
            currentUser = null;
            currentBooks = [];
            currentCharacters = [];
            showScreen('login-screen');
            document.getElementById('username').value = '';
            document.getElementById('email').value = '';
            showToast('已退出登录');
        }

        async function loadBooks() {
            const container = document.getElementById('books-list');
            container.innerHTML = '<div class="loading">加载中</div>';
            
            try {
                const data = await apiRequest(`/books?userId=${currentUser.user_id}`);
                currentBooks = data.books || [];
                
                if (currentBooks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📚</div>
                            <p>还没有书籍，创建你的第一本书吧！</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = currentBooks.map(book => `
                        <div class="card" data-book-id="${book.book_id}">
                            <h3>${book.title}</h3>
                            <p>章节数: ${book.chapter_count || 0} | 状态: ${book.status || '进行中'}</p>
                        </div>
                    `).join('');
                    
                    container.querySelectorAll('.card').forEach(card => {
                        card.addEventListener('click', () => showBookDetail(card.dataset.bookId));
                    });
                }
            } catch (error) {
                container.innerHTML = `<div class="empty-state"><p>加载失败: ${error.message}</p></div>`;
            }
        }

        async function createBook() {
            const title = document.getElementById('book-title').value.trim();
            if (!title) {
                showToast('请输入书籍标题', 'error');
                return;
            }

            try {
                const data = await apiRequest('/books', {
                    method: 'POST',
                    body: { userId: currentUser.user_id, title }
                });
                showToast(`书籍创建成功! ID: ${data.bookId}`);
                document.getElementById('book-title').value = '';
                showScreen('bookshelf-screen');
                loadBooks();
            } catch (error) {
                showToast(`创建失败: ${error.message}`, 'error');
            }
        }

        async function showBookDetail(bookId) {
            currentBook = currentBooks.find(b => b.book_id === bookId);
            if (!currentBook) return;

            document.getElementById('book-detail-title').textContent = currentBook.title;
            document.getElementById('book-info').innerHTML = `
                <p><strong>书籍ID:</strong> ${currentBook.book_id}</p>
                <p><strong>标题:</strong> ${currentBook.title}</p>
                <p><strong>章节数:</strong> ${currentBook.chapter_count || 0}</p>
                <p><strong>状态:</strong> ${currentBook.status || '进行中'}</p>
            `;

            try {
                const data = await apiRequest(`/chapters?bookId=${bookId}`);
                const chapters = data.chapters || [];
                const container = document.getElementById('chapters-list');
                
                if (chapters.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>还没有章节</p></div>';
                } else {
                    container.innerHTML = chapters.map(ch => `
                        <div class="chapter-item">
                            <span class="chapter-number">第${ch.chapter_number}章</span>
                            <span>${ch.title}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('chapters-list').innerHTML = `<p>加载章节失败: ${error.message}</p>`;
            }

            showScreen('book-detail-screen');
        }

        async function deleteBook() {
            if (!currentBook) return;
            if (!confirm(`确定要删除书籍 "${currentBook.title}" 吗?`)) return;

            try {
                await apiRequest(`/books?id=${currentBook.book_id}`, { method: 'DELETE' });
                showToast('书籍已删除');
                showScreen('bookshelf-screen');
                loadBooks();
            } catch (error) {
                showToast(`删除失败: ${error.message}`, 'error');
            }
        }

        async function loadCharacters() {
            const container = document.getElementById('characters-list');
            container.innerHTML = '<div class="loading">加载中</div>';
            
            try {
                const data = await apiRequest(`/characters?userId=${currentUser.user_id}`);
                currentCharacters = data.characters || [];
                
                if (currentCharacters.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">👥</div>
                            <p>还没有人仔，创建你的第一个人仔吧！</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = currentCharacters.map(char => `
                        <div class="character-card" data-character-id="${char.character_id}">
                            <div class="character-avatar">🧙</div>
                            <div class="character-info">
                                <h3>${char.name}</h3>
                                <p>${char.description || '无描述'}</p>
                                <p><small>性格: ${char.personality || '未知'}</small></p>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                container.innerHTML = `<div class="empty-state"><p>加载失败: ${error.message}</p></div>`;
            }
        }

        async function createCharacter() {
            const name = document.getElementById('character-name').value.trim();
            const description = document.getElementById('character-description').value.trim();
            const personality = document.getElementById('character-personality').value.trim();
            
            if (!name) {
                showToast('请输入人仔名称', 'error');
                return;
            }

            try {
                const data = await apiRequest('/characters', {
                    method: 'POST',
                    body: {
                        name,
                        description,
                        personality,
                        creatorId: currentUser.user_id
                    }
                });
                showToast(`人仔创建成功! ID: ${data.characterId}`);
                document.getElementById('character-name').value = '';
                document.getElementById('character-description').value = '';
                document.getElementById('character-personality').value = '';
                showScreen('characters-screen');
                loadCharacters();
            } catch (error) {
                showToast(`创建失败: ${error.message}`, 'error');
            }
        }

        async function loadPlotOptions() {
            const container = document.getElementById('plot-options-container');
            container.innerHTML = '<div class="loading">加载中</div>';
            
            try {
                const data = await apiRequest('/plot-options');
                const options = data.plotOptions || data;
                
                container.innerHTML = Object.entries(options).map(([key, values]) => `
                    <div class="plot-section">
                        <h4>${key}</h4>
                        <div class="plot-options">
                            ${values.map(v => `<div class="plot-option" data-type="${key}" data-value="${v}">${v}</div>`).join('')}
                        </div>
                    </div>
                `).join('');

                container.querySelectorAll('.plot-option').forEach(opt => {
                    opt.addEventListener('click', () => {
                        opt.parentElement.querySelectorAll('.plot-option').forEach(o => o.classList.remove('selected'));
                        opt.classList.add('selected');
                    });
                });
            } catch (error) {
                container.innerHTML = `<div class="empty-state"><p>加载失败: ${error.message}</p></div>`;
            }
        }

        async function runAllTests() {
            const container = document.getElementById('test-results');
            container.innerHTML = '<div class="loading">运行测试中</div>';
            
            const tests = [
                {
                    name: 'API连接测试',
                    fn: async () => {
                        const response = await fetch(`${API_BASE}/plot-options`);
                        return response.ok;
                    }
                },
                {
                    name: '用户创建测试',
                    fn: async () => {
                        const testUser = `test_${Date.now()}`;
                        const data = await apiRequest('/users', {
                            method: 'POST',
                            body: { username: testUser, email: `${testUser}@test.com` }
                        });
                        return data.user && data.user.user_id;
                    }
                },
                {
                    name: '书籍创建测试',
                    fn: async () => {
                        const data = await apiRequest('/books', {
                            method: 'POST',
                            body: { userId: currentUser.user_id, title: `测试书籍_${Date.now()}` }
                        });
                        return data.bookId;
                    }
                },
                {
                    name: '书籍列表获取测试',
                    fn: async () => {
                        const data = await apiRequest(`/books?userId=${currentUser.user_id}`);
                        return Array.isArray(data.books);
                    }
                },
                {
                    name: '人仔创建测试',
                    fn: async () => {
                        const data = await apiRequest('/characters', {
                            method: 'POST',
                            body: {
                                name: `测试人仔_${Date.now()}`,
                                description: '自动化测试创建',
                                creatorId: currentUser.user_id
                            }
                        });
                        return data.characterId;
                    }
                },
                {
                    name: '人仔列表获取测试',
                    fn: async () => {
                        const data = await apiRequest(`/characters?userId=${currentUser.user_id}`);
                        return Array.isArray(data.characters);
                    }
                },
                {
                    name: '情节选项获取测试',
                    fn: async () => {
                        const data = await apiRequest('/plot-options');
                        return data.plotOptions || data;
                    }
                }
            ];

            const results = [];
            for (const test of tests) {
                try {
                    const result = await test.fn();
                    results.push({
                        name: test.name,
                        pass: true,
                        detail: `结果: ${JSON.stringify(result).substring(0, 100)}`
                    });
                } catch (error) {
                    results.push({
                        name: test.name,
                        pass: false,
                        detail: `错误: ${error.message}`
                    });
                }
            }

            container.innerHTML = results.map(r => `
                <div class="test-result ${r.pass ? 'pass' : 'fail'}">
                    <div class="test-name">${r.pass ? '✓' : '✗'} ${r.name}</div>
                    <div class="test-detail">${r.detail}</div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const apiReady = await checkAPIStatus();
            
            if (apiReady) {
                document.getElementById('login-btn').addEventListener('click', login);
                document.getElementById('logout-btn').addEventListener('click', logout);
                
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const screen = item.dataset.screen;
                        showScreen(`${screen}-screen`);
                        if (screen === 'bookshelf') loadBooks();
                        if (screen === 'characters') loadCharacters();
                        if (screen === 'plot-options') loadPlotOptions();
                    });
                });

                document.querySelectorAll('[data-back]').forEach(btn => {
                    btn.addEventListener('click', () => showScreen('home-screen'));
                });

                document.getElementById('create-book-btn').addEventListener('click', () => {
                    showScreen('create-book-screen');
                });

                document.getElementById('back-to-bookshelf').addEventListener('click', () => {
                    showScreen('bookshelf-screen');
                });

                document.getElementById('back-to-bookshelf-from-detail').addEventListener('click', () => {
                    showScreen('bookshelf-screen');
                });

                document.getElementById('submit-create-book').addEventListener('click', createBook);
                document.getElementById('delete-book-btn').addEventListener('click', deleteBook);

                document.getElementById('create-character-btn').addEventListener('click', () => {
                    showScreen('create-character-screen');
                });

                document.getElementById('back-to-characters').addEventListener('click', () => {
                    showScreen('characters-screen');
                });

                document.getElementById('submit-create-character').addEventListener('click', createCharacter);

                document.getElementById('run-all-tests').addEventListener('click', runAllTests);

                showScreen('login-screen');
            }
        });
    </script>
</body>
</html>
