<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>故事详情 - 乐高故事书</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="lego-brick-bg"></div>
  
  <div class="container">
    <header class="header">
      <h1 id="bookTitle">📖 故事详情</h1>
      <nav class="nav">
        <a href="bookshelf.html">📚 我的书架</a>
        <a href="share.html" id="shareBtn">📤 分享故事</a>
      </nav>
    </header>

    <main>
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>🎭 故事角色</h2>
          <button class="btn btn-primary" id="addCharacterBtn">➕ 添加角色</button>
        </div>
        <div class="grid" id="characterList"></div>
      </div>

      <div class="card" id="addCharacterCard" style="display: none;">
        <h2>➕ 添加新角色</h2>
        <div class="form-group">
          <label>选择人仔</label>
          <select id="characterSelect" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>自定义名称</label>
          <input type="text" id="customName" class="form-control" placeholder="为角色取个名字" maxlength="20">
        </div>
        <div class="form-group">
          <label>角色类型</label>
          <select id="roleTypeSelect" class="form-control">
            <option value="protagonist">⭐ 主角</option>
            <option value="supporting">🎭 配角</option>
            <option value="antagonist">👿 反派</option>
            <option value="bystander">🚶 路人</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-primary" id="saveCharacterBtn">✅ 保存</button>
          <button class="btn btn-secondary" id="cancelAddBtn">❌ 取消</button>
        </div>
      </div>

      <div class="card">
        <h2>📚 章节列表</h2>
        <ul class="chapter-list" id="chapterList"></ul>
        <button class="btn btn-secondary" id="addChapterBtn" style="margin-top: 20px;">➕ 添加章节</button>
      </div>

      <div class="card" id="chapterContentCard" style="display: none;">
        <h2>📖 章节内容</h2>
        <div id="chapterContentDisplay" style="font-size: 1.1rem; line-height: 1.8; padding: 15px;"></div>
      </div>

      <div class="card" id="promptCard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" id="promptHeader">
          <h2>📝 生成提示词</h2>
          <span id="promptToggle">▼ 点击展开</span>
        </div>
        <div id="promptContent" style="display: none; margin-top: 15px;">
          <pre style="background: #f5f5f5; padding: 15px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; font-size: 0.9rem; line-height: 1.6;"></pre>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>乐高故事书 &copy; 2024 - 让想象力飞翔</p>
    </footer>
  </div>

  <div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>✏️ 编辑角色</h3>
      <div class="form-group">
        <label>自定义名称</label>
        <input type="text" id="editCustomName" class="form-control" maxlength="20">
      </div>
      <div class="form-group">
        <label>角色类型</label>
        <select id="editRoleType" class="form-control">
          <option value="protagonist">⭐ 主角</option>
          <option value="supporting">🎭 配角</option>
          <option value="antagonist">👿 反派</option>
          <option value="bystander">🚶 路人</option>
        </select>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" id="updateCharacterBtn">✅ 保存</button>
        <button class="btn btn-secondary" id="closeModalBtn">❌ 取消</button>
      </div>
    </div>
  </div>

  <style>
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 3px solid var(--lego-yellow);
      border-radius: 15px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--lego-blue);
      box-shadow: 0 0 10px rgba(0, 107, 166, 0.2);
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--lego-blue);
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 25px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .character-card {
      position: relative;
    }
    .character-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .character-card:hover .character-actions {
      opacity: 1;
    }
    .action-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .action-btn:hover {
      transform: scale(1.1);
    }
    .edit-btn {
      background: var(--lego-blue);
      color: white;
    }
    .delete-btn {
      background: var(--lego-red);
      color: white;
    }
    .role-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .role-protagonist { background: #FFF3E0; color: #E65100; }
    .role-supporting { background: #E3F2FD; color: #1565C0; }
    .role-antagonist { background: #FFEBEE; color: #C62828; }
    .role-bystander { background: #F3E5F5; color: #7B1FA2; }
  </style>

  <script src="js/utils.js"></script>
  <script>
    var userId = requireAuth();
    var bookId = getQueryParam('id');
    var bookCharacters = [];
    var allCharacters = [];
    var editingCharacterId = null;

    if (bookId) {
      loadBook();
      loadAllCharacters();
    } else {
      window.location.href = 'bookshelf.html';
    }

    async function loadAllCharacters() {
      try {
        var data = await fetchAPI('/characters');
        allCharacters = data.characters || [];
      } catch (error) {
        console.error('Failed to load characters:', error);
      }
    }

    async function loadBook() {
      try {
        var data = await fetchAPI('/books?bookId=' + bookId + '&userId=' + userId);
        document.getElementById('bookTitle').textContent = '📖 ' + data.book.title;
        bookCharacters = data.characters || [];
        
        renderCharacters();
        
        var chapterContainer = document.getElementById('chapterList');
        if (data.chapters.length === 0) {
          chapterContainer.innerHTML = '<li class="chapter-item" style="justify-content: center; color: #999;">还没有章节，点击下方按钮添加</li>';
        } else {
          chapterContainer.innerHTML = data.chapters.map(function(ch) {
            var puzzleIcon = '';
            if (ch.has_puzzle) {
              if (ch.puzzle_result === 1) {
                puzzleIcon = '<span style="font-size: 1.5rem;" title="解谜成功">✅</span>';
              } else if (ch.puzzle_result === 0) {
                puzzleIcon = '<span style="font-size: 1.5rem;" title="解谜失败">❌</span>';
              } else {
                puzzleIcon = '<span style="font-size: 1.5rem;">🧩</span>';
              }
            }
            return '<li class="chapter-item" onclick="readChapter(\'' + ch.chapter_id + '\')">' +
              '<span class="chapter-number">第' + ch.chapter_number + '章</span>' +
              '<span class="chapter-title">' + ch.title + '</span>' +
              puzzleIcon +
            '</li>';
          }).join('');
        }
        
        document.getElementById('shareBtn').href = 'share.html?bookId=' + bookId;
      } catch (error) {
        showToast('加载失败：' + error.message, 'error');
      }
    }

    function getRoleLabel(roleType) {
      var roles = {
        'protagonist': '⭐ 主角',
        'supporting': '🎭 配角',
        'antagonist': '👿 反派',
        'bystander': '🚶 路人'
      };
      return roles[roleType] || '🎭 配角';
    }

    function renderCharacters() {
      var emojis = ['🦸', '🧙', '🧝', '🦹', '👸', '🤴', '🧛', '🧟', '🤖', '👻', '🧚', '🧜'];
      var charContainer = document.getElementById('characterList');
      
      if (bookCharacters.length === 0) {
        charContainer.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">还没有角色，点击上方按钮添加</p>';
        return;
      }
      
      charContainer.innerHTML = bookCharacters.map(function(char, index) {
        var emoji = emojis[index % emojis.length];
        return '<div class="character-card">' +
          '<div class="character-actions">' +
            '<button class="action-btn edit-btn" onclick="openEditModal(\'' + char.id + '\')">✏️</button>' +
            '<button class="action-btn delete-btn" onclick="deleteCharacter(\'' + char.id + '\')">🗑️</button>' +
          '</div>' +
          '<div class="character-avatar" style="width:80px;height:80px;font-size:2rem;">' + emoji + '</div>' +
          '<h3>' + char.custom_name + '</h3>' +
          '<p><span class="role-badge role-' + char.role_type + '">' + getRoleLabel(char.role_type) + '</span></p>' +
        '</div>';
      }).join('');
    }

    document.getElementById('addCharacterBtn').addEventListener('click', function() {
      var card = document.getElementById('addCharacterCard');
      card.style.display = card.style.display === 'none' ? 'block' : 'none';
      
      if (card.style.display === 'block') {
        var existingIds = bookCharacters.map(function(c) { return c.character_id; });
        var availableChars = allCharacters.filter(function(c) { 
          return existingIds.indexOf(c.character_id) === -1;
        });
        
        var select = document.getElementById('characterSelect');
        if (availableChars.length === 0) {
          select.innerHTML = '<option value="">没有可选的人仔</option>';
        } else {
          select.innerHTML = availableChars.map(function(c) {
            return '<option value="' + c.character_id + '">' + c.name + '</option>';
          }).join('');
        }
        
        document.getElementById('customName').value = '';
        document.getElementById('roleTypeSelect').value = 'supporting';
      }
    });

    document.getElementById('cancelAddBtn').addEventListener('click', function() {
      document.getElementById('addCharacterCard').style.display = 'none';
    });

    document.getElementById('saveCharacterBtn').addEventListener('click', async function() {
      var characterId = document.getElementById('characterSelect').value;
      var customName = document.getElementById('customName').value.trim();
      var roleType = document.getElementById('roleTypeSelect').value;
      
      if (!characterId) {
        showToast('请选择人仔', 'error');
        return;
      }
      if (!customName) {
        showToast('请输入自定义名称', 'error');
        return;
      }
      
      try {
        await fetchAPI('/book-characters', {
          method: 'POST',
          body: {
            bookId: bookId,
            characterId: characterId,
            customName: customName,
            roleType: roleType
          }
        });
        showToast('角色添加成功！🎉', 'success');
        document.getElementById('addCharacterCard').style.display = 'none';
        loadBook();
      } catch (error) {
        showToast('添加失败：' + error.message, 'error');
      }
    });

    function openEditModal(id) {
      editingCharacterId = id;
      var char = bookCharacters.find(function(c) { return c.id === id; });
      if (!char) return;
      
      document.getElementById('editCustomName').value = char.custom_name;
      document.getElementById('editRoleType').value = char.role_type;
      document.getElementById('editModal').style.display = 'flex';
    }

    document.getElementById('closeModalBtn').addEventListener('click', function() {
      document.getElementById('editModal').style.display = 'none';
      editingCharacterId = null;
    });

    document.getElementById('updateCharacterBtn').addEventListener('click', async function() {
      if (!editingCharacterId) return;
      
      var customName = document.getElementById('editCustomName').value.trim();
      var roleType = document.getElementById('editRoleType').value;
      
      if (!customName) {
        showToast('请输入自定义名称', 'error');
        return;
      }
      
      try {
        await fetchAPI('/book-characters', {
          method: 'PUT',
          body: {
            id: editingCharacterId,
            customName: customName,
            roleType: roleType
          }
        });
        showToast('角色更新成功！🎉', 'success');
        document.getElementById('editModal').style.display = 'none';
        editingCharacterId = null;
        loadBook();
      } catch (error) {
        showToast('更新失败：' + error.message, 'error');
      }
    });

    async function deleteCharacter(id) {
      if (!confirm('确定要删除这个角色吗？')) return;
      
      try {
        await fetchAPI('/book-characters?id=' + id, {
          method: 'DELETE'
        });
        showToast('角色删除成功！', 'success');
        loadBook();
      } catch (error) {
        showToast('删除失败：' + error.message, 'error');
      }
    }

    document.getElementById('addChapterBtn').addEventListener('click', async function() {
      if (bookCharacters.length === 0) {
        if (confirm('还没有角色，是否现在添加角色？')) {
          document.getElementById('addCharacterCard').style.display = 'block';
          document.getElementById('addCharacterCard').scrollIntoView({ behavior: 'smooth' });
        }
        return;
      }
      
      var chapterCount = document.querySelectorAll('.chapter-item').length;
      if (chapterCount >= 100) {
        showToast('📚 本书籍已达章节上限，请创建新书籍', 'error');
        return;
      }
      
      showChapterCharacterSelect();
    });

    function showChapterCharacterSelect() {
      var modal = document.createElement('div');
      modal.className = 'modal';
      modal.id = 'chapterCharacterModal';
      modal.style.display = 'flex';
      
      var characterCheckboxes = bookCharacters.map(function(c, index) {
        return '<div style="display: flex; align-items: center; gap: 10px; padding: 10px; background: #f5f5f5; border-radius: 10px; margin-bottom: 10px;">' +
          '<input type="checkbox" id="char_' + index + '" value="' + c.character_id + '" checked>' +
          '<label for="char_' + index + '" style="flex: 1; cursor: pointer;">' +
            '<strong>' + c.custom_name + '</strong> (' + getRoleLabel(c.role_type) + ')' +
          '</label>' +
        '</div>';
      }).join('');
      
      modal.innerHTML = '<div class="modal-content" style="max-width: 500px;">' +
        '<h3>🎭 选择本章角色</h3>' +
        '<p style="color: #666; margin-bottom: 15px;">选择参与本章故事的角色</p>' +
        '<div style="max-height: 300px; overflow-y: auto;">' + characterCheckboxes + '</div>' +
        '<div style="display: flex; gap: 10px; margin-top: 15px;">' +
          '<button class="btn btn-primary" id="confirmChapterChars">✅ 确认生成</button>' +
          '<button class="btn btn-secondary" onclick="document.getElementById(\'chapterCharacterModal\').remove()">❌ 取消</button>' +
        '</div>' +
      '</div>';
      
      document.body.appendChild(modal);
      
      document.getElementById('confirmChapterChars').addEventListener('click', async function() {
        var selectedChars = [];
        var checkboxes = document.querySelectorAll('#chapterCharacterModal input[type="checkbox"]:checked');
        checkboxes.forEach(function(cb) {
          var char = bookCharacters.find(function(c) { return c.character_id === cb.value; });
          if (char) selectedChars.push(char);
        });
        
        if (selectedChars.length === 0) {
          showToast('请至少选择一个角色', 'error');
          return;
        }
        
        document.getElementById('chapterCharacterModal').remove();
        await generateNewChapter(selectedChars);
      });
    }

    async function generateNewChapter(selectedChars) {
      var btn = document.getElementById('addChapterBtn');
      btn.disabled = true;
      btn.textContent = '🔄 生成中...';
      
      try {
        var charactersData = selectedChars.map(function(c) {
          return {
            character_id: c.character_id,
            custom_name: c.custom_name,
            original_name: c.original_name || c.character_name || '未知',
            personality: c.personality || '神秘',
            speaking_style: c.speaking_style || '正常'
          };
        });
        
        var previousSummary = null;
        var previousPuzzle = null;
        var previousAnswer = null;
        var chapterItems = document.querySelectorAll('.chapter-item');
        var currentChapterCount = chapterItems.length;
        
        if (chapterItems.length > 0) {
          var lastChapterItem = chapterItems[chapterItems.length - 1];
          var onclickAttr = lastChapterItem.getAttribute('onclick');
          if (onclickAttr) {
            var lastChapterId = onclickAttr.match(/'([^']+)'/);
            if (lastChapterId) {
              try {
                var lastChapterData = await fetchAPI('/chapters?id=' + lastChapterId[1] + '&userId=' + userId);
                if (lastChapterData.chapter && lastChapterData.chapter.content) {
                  previousSummary = lastChapterData.chapter.content.substring(0, 300);
                }
                if (lastChapterData.puzzle) {
                  var isCorrect = lastChapterData.puzzleRecord ? lastChapterData.puzzleRecord.is_correct === 1 : true;
                  previousPuzzle = {
                    question: lastChapterData.puzzle.question,
                    answer: lastChapterData.puzzle.answer,
                    isCorrect: isCorrect
                  };
                }
              } catch (e) {
                console.error('Failed to get previous chapter:', e);
              }
            }
          }
        }
        
        var storyData = await fetchAPI('/story', {
          method: 'POST',
          body: {
            characters: charactersData,
            plot: '冒险之旅',
            chapter: (currentChapterCount + 1),
            chapterCharacters: charactersData,
            previousSummary: previousSummary,
            previousPuzzle: previousPuzzle
          }
        });
        
        var chapterData = {
          bookId: bookId,
          title: storyData.title || '新章节',
          content: storyData.content
        };
        
        if (storyData.puzzle) {
          chapterData.puzzle = storyData.puzzle;
        }
        
        await fetchAPI('/chapters', {
          method: 'POST',
          body: chapterData
        });
        
        showToast('章节生成成功！🎉', 'success');
        loadBook();
        
        if (storyData.prompt) {
          document.getElementById('promptCard').style.display = 'block';
          document.getElementById('promptContent').querySelector('pre').textContent = storyData.prompt;
        }
      } catch (error) {
        showToast('生成失败：' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '➕ 添加章节';
      }
    }

    function readChapter(chapterId) {
      loadChapterContent(chapterId);
    }

    async function loadChapterContent(chapterId) {
      try {
        var data = await fetchAPI('/chapters?id=' + chapterId);
        var chapter = data.chapter;
        
        var highlightedContent = highlightKeywords(chapter.content, bookCharacters);
        
        document.getElementById('chapterContentCard').style.display = 'block';
        document.getElementById('chapterContentDisplay').innerHTML = 
          '<h3 style="color: var(--lego-blue); margin-bottom: 15px;">第' + chapter.chapter_number + '章：' + chapter.title + '</h3>' +
          '<p style="text-align: justify; line-height: 2;">' + highlightedContent + '</p>' +
          (chapter.has_puzzle ? '<p style="text-align: center; margin-top: 20px;"><a href="adventure.html?chapterId=' + chapterId + '" class="btn btn-primary">🧩 去解密</a></p>' : '');
        
        document.getElementById('chapterContentCard').scrollIntoView({ behavior: 'smooth' });
      } catch (error) {
        showToast('加载章节失败：' + error.message, 'error');
      }
    }

    function escapeRegex(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightKeywords(content, characters) {
      var keywords = [];
      characters.forEach(function(char) {
        if (char.custom_name) {
          keywords.push({
            text: char.custom_name,
            role: char.role_type
          });
        }
      });
      
      var actionWords = ['飞向', '跳跃', '奔跑', '战斗', '探索', '发现', '拯救', '追逐', '攀爬', '游泳', '飞翔', '旋转', '冲刺', '躲闪', '攻击', '防御', '寻找', '收集', '建造', '修复'];
      actionWords.forEach(function(word) {
        keywords.push({ text: word, type: 'action' });
      });
      
      var emotionWords = ['开心', '快乐', '勇敢', '害怕', '兴奋', '紧张', '感动', '惊讶', '愤怒', '悲伤', '期待', '满足', '自豪', '担心', '安心', '激动', '欣慰', '坚定', '犹豫'];
      emotionWords.forEach(function(word) {
        keywords.push({ text: word, type: 'emotion' });
      });
      
      var locationWords = ['城堡', '森林', '太空', '海底', '沙漠', '雪山', '火山', '洞穴', '城市', '村庄', '花园', '岛屿', '山脉', '河流', '星空', '云层', '迷宫', '宝藏', '遗迹', '基地'];
      locationWords.forEach(function(word) {
        keywords.push({ text: word, type: 'location' });
      });
      
      keywords.sort(function(a, b) { return b.text.length - a.text.length; });
      
      keywords.forEach(function(kw) {
        var regex = new RegExp('(' + escapeRegex(kw.text) + ')', 'g');
        var highlightClass;
        if (kw.role) {
          highlightClass = 'keyword-highlight keyword-' + kw.role;
        } else if (kw.type === 'action') {
          highlightClass = 'keyword-highlight keyword-action';
        } else if (kw.type === 'emotion') {
          highlightClass = 'keyword-highlight keyword-emotion';
        } else if (kw.type === 'location') {
          highlightClass = 'keyword-highlight keyword-location';
        }
        if (highlightClass) {
          content = content.replace(regex, '<span class="' + highlightClass + '">$1</span>');
        }
      });
      
      return content;
    }

    document.getElementById('promptHeader').addEventListener('click', function() {
      var content = document.getElementById('promptContent');
      var toggle = document.getElementById('promptToggle');
      if (content.style.display === 'none') {
        content.style.display = 'block';
        toggle.textContent = '▲ 点击收起';
      } else {
        content.style.display = 'none';
        toggle.textContent = '▼ 点击展开';
      }
    });
  </script>
</body>
</html>
