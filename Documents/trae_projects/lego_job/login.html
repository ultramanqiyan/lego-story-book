<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 乐高故事书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600&family=Cinzel:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" id="theme-stylesheet" href="" disabled>
</head>
<body>
  <div class="lego-brick-bg"></div>
  <div class="particles-container">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="container page-wrapper">
    <header class="header">
      <h1 class="neon-text rainbow-text">乐高故事书</h1>
      <p class="bounce-animation">🎮 登录开始你的冒险！</p>
    </header>

    <main>
      <div class="card card-3d neon-border scroll-fade-in" style="max-width: 450px; margin: 50px auto; text-align: center;">
        <h2 style="justify-content: center;" class="pulse-scale">🎮 登录 / 注册</h2>

        <div class="lego-loader" style="margin: 30px auto;">
          <div class="lego-block"></div>
          <div class="lego-block"></div>
          <div class="lego-block"></div>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username" class="float-animation">👤 你的名字</label>
            <input type="text" id="username" name="username" class="input-glow" placeholder="输入你的冒险者名字" required maxlength="20">
          </div>

          <div class="form-group">
            <label for="email" class="float-animation" style="animation-delay: 0.2s;">📧 邮箱（可选）</label>
            <input type="email" id="email" name="email" class="input-glow" placeholder="输入邮箱地址">
          </div>

          <button type="submit" class="btn btn-primary btn-glow btn-ripple magnetic-btn" style="width: 100%; font-size: 1.2rem; padding: 18px;">
            🚀 开始冒险
          </button>
        </form>

        <p class="float-animation" style="margin-top: 25px; color: #999; font-size: 0.95rem; animation-delay: 0.4s;">
          💡 首次登录将自动创建账号
        </p>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/theme-manager.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      var username = document.getElementById('username').value.trim();
      var email = document.getElementById('email').value.trim();
      
      if (!username) {
        showToast('请输入你的名字', 'error');
        return;
      }
      
      try {
        var data = await fetchAPI('/users', {
          method: 'POST',
          body: {
            username: username,
            email: email || null
          }
        });
        
        setUserId(data.userId);
        showToast('欢迎，' + username + '！🎉', 'success');
        
        setTimeout(function() {
          window.location.href = 'bookshelf.html';
        }, 1000);
      } catch (error) {
        showToast('登录失败：' + error.message, 'error');
      }
    });

    var existingUserId = getUserId();
    if (existingUserId) {
      window.location.href = 'bookshelf.html';
    }
  </script>
</body>
</html>
